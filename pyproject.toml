[project]
name = "offboarding-bench"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["verifier_selftests"]
pythonpath = ["tasks/offboard-departed-employee/tests"]
addopts = "-v"
